# The tutorial is generated from docs/src, the files its listings quote and
# bench/results, and the generated page is committed. On every push and
# pull request this rebuilds the page and fails if the committed copy is
# stale. On a version tag it builds the release page, labelled with the
# tag's version and date, attaches it to the GitHub release of the tag,
# and publishes it as the home page of the project's GitHub Pages site.
# Pages needs two settings: Settings, Pages, Source: GitHub Actions; and
# Settings, Environments, github-pages, a deployment tag rule v*, because
# that environment accepts only the default branch until told otherwise.
#
# Run workflow (from the default branch, with a tag) builds and publishes
# an existing tag again, from that tag's own files, without moving the tag.
name: tutorial

on:
  push:
    branches: ["**"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build and publish, e.g. v1.0.0"
        required: true

permissions:
  contents: read

jobs:
  check:
    if: github.ref_type != 'tag' && github.event_name != 'workflow_dispatch'
    # A pinned image keeps the Python that builds the page from changing
    # under the committed copy.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Rebuild the tutorial
        run: python3 docs/build_tutorial.py
      - name: The committed page is the one its sources produce
        run: |
          if ! git diff --quiet -- docs/holsti-tutorial.html; then
            git diff --stat -- docs/holsti-tutorial.html
            echo "::error file=docs/holsti-tutorial.html::stale: run python3 docs/build_tutorial.py and commit the page"
            exit 1
          fi

  release:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          # the tag's own files, and the whole history with its tags, for
          # the date of the tag
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Build the page for this tag
        run: python3 docs/build_tutorial.py --release "$TAG"
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" docs/holsti-tutorial.html --clobber
          else
            pre=()
            if [[ "$TAG" == *-* ]]; then pre=(--prerelease); fi
            gh release create "$TAG" docs/holsti-tutorial.html \
              --title "Holsti ${TAG#v}" --generate-notes --verify-tag "${pre[@]}"
          fi
      - name: Stage the page as the site's home page
        run: |
          mkdir -p _site
          cp docs/holsti-tutorial.html _site/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  pages:
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

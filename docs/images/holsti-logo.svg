    <path d="M182 336 C208 348 236 362 258 388"/>
    <path d="M172 362 C196 374 220 386 238 400"/>
  </g>

  <!-- face: blush, eye, beak -->
  <ellipse cx="362" cy="318" rx="20" ry="11" fill="#f19a76" opacity="0.6"/>
  <circle cx="336" cy="286" r="14" fill="#14161f"/>
  <circle cx="341" cy="281" r="4.5" fill="#ffffff"/>
  <path d="M390 274 C420 282 434 294 430 303 C414 310 396 308 384 300 Z" fill="#15161c" stroke="#15161c" stroke-width="4" stroke-linejoin="round"/>
  </g>
